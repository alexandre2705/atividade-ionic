<ion-side-menus enable-menu-with-back-views="false">

  <ion-side-menu-content>
    <ion-nav-bar class="bar-positive">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left">
    <div class="menu-topo">
      <h3>{{ aluno.nome }}</h3>
      <small>Matrícula {{ aluno.matricula }}</small>
    </div>
    <ion-content style="top: 80px;">
      <ion-list>
        <ion-item menu-close ui-sref="app.noticias">
          <i class="icon ion-ios-paper"></i> Mural
        </ion-item>
        <ion-item menu-close ui-sref="app.perfil">
          <i class="icon ion-person"></i> Atualização Cadastral
        </ion-item>
        <ion-item menu-close ui-sref="app.financeiro">
          <i class="icon ion-cash"></i> Financeiro
        </ion-item>
        <ion-item menu-close ng-click="sair()">
          <i class="icon ion-log-out"></i> Sair
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-side-menu>

</ion-side-menus>
